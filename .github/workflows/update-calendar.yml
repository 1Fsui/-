name: Update global holiday calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Publish calendar files
        run: |
          cp public/holiday.ics ./holiday.ics
          cp public/index.html ./index.html

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ holiday.ics index.html
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "chore: update holiday calendar"
            git push
          fi
